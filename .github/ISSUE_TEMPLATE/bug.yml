name: Bug report
description: Report behaviour the example does not keep to.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Report a vulnerability through a private advisory rather than here. A defect in one
        of the helpers belongs in its own repository: bats-expect, bats-matrix or bats-mock.

  - type: input
    id: version
    attributes:
      label: Version
      description: The commit of bats-example you run.
      placeholder: main
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        The output of `podman --version` or `docker --version` and `uname -sr`, or for a host
        run, of `bats --version` and `bash --version | head -1`.
      render: shell
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The command
      description: The `make` line you ran, and the test or `releasectl` call that shows the behaviour.
      render: bash
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The behaviour the README led you to expect.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: What the example did instead. Paste the output whole rather than a summary of it.
      render: shell
    validations:
      required: true
