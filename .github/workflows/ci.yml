name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  SHELLCHECK_VERSION: v0.11.0

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" |
            tar -xJ --strip-components=1 -C "$HOME/.local/bin" "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make lint

  test:
    name: test (bash ${{ matrix.bash }}, bats ${{ matrix.bats }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bash: ['4.4', '5.1', '5.2', '5.3']
        bats: ['1.7.0', '1.14.0']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: make test test-reports RUNTIME=docker BASH_VERSION=${{ matrix.bash }} BATS_VERSION=${{ matrix.bats }}

  test-fedora:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: make test test-reports RUNTIME=docker DISTRO=fedora

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: make coverage RUNTIME=docker DISTRO=fedora
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  test-host:
    name: test-host (${{ matrix.os }}, bats ${{ matrix.bats }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bats: ['1.7.0', '1.14.0']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install host tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install host tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash coreutils jq
          # Only mv and timeout need GNU semantics. Keep macOS stat: bats-expect
          # selects its permission-query flags by OS, not by the binary on PATH.
          coreutils_bin="$(brew --prefix coreutils)/bin"
          host_tools=$(mktemp -d "$RUNNER_TEMP/bats-example-tools.XXXXXXXX")
          ln -s "$coreutils_bin/gmv" "$host_tools/mv"
          ln -s "$coreutils_bin/gtimeout" "$host_tools/timeout"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$host_tools" >> "$GITHUB_PATH"
      - name: Install bats-core ${{ matrix.bats }}
        run: |
          bats_source=$(mktemp -d)
          curl -fsSL "https://codeload.github.com/bats-core/bats-core/tar.gz/v${{ matrix.bats }}" |
            tar -xz --strip-components=1 -C "$bats_source"
          "$bats_source/install.sh" "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Match the normal terminal SIGPIPE behavior for pipeline/spy examples.
      - run: perl -e '$SIG{PIPE} = "DEFAULT"; exec @ARGV' make test-host
      - name: Verify failure reports with host bats
        env:
          BATS_LIB_PATH: ${{ github.workspace }}/tests/helpers
        run: bash scripts/check-reports.bash bats --formatter tap examples/failures.bats
